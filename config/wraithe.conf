# Wraithe Configuration
# WiFi Penetration Testing Toolkit

[general]
interface = wlan0
monitor_interface = wlan0mon
channel = 1
band = bg
verbose = true
log_dir = /tmp/wraithe_logs

[wps]
reaver_timeout = 120
reaver_delay = 5
bully_timeout = 120
oneshot_timeout = 180
pin_delay = 1
lock_wait = 60
max_attempts = 0
pixie_fork = reaver

[known_pins]
database = /opt/wraithe/data/known_pins.db
auto_test = true
generate_similar = true

[handshake]
capture_timeout = 120
output_dir = /tmp/wraithe_logs
wordlist = /usr/share/wordlists/rockyou.txt.gz

[pmkid]
capture_timeout = 120
output_dir = /tmp/wraithe_logs

[deauth]
packet_count = 10
reason_code = 7
